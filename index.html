      var p = A.pct[a][i], v = qval(a, p);
      var txt = v == null ? 'no data' : (m.bool ? v : '≈ ' + fmt(v, m.unit));
      rows += '<dt>' + esc(m.label) + '</dt><dd class="' + (a === attrIdx ? 'on' : '') +
              (v == null ? ' na' : '') + '">' + esc(txt) + '</dd>';
    });
    return h + '<dl class="pc-dl">' + rows + '</dl>';
  }

  function regPopup(i){
    var county = A.strings[A.county[i]], state = A.strings[A.state[i]];
    var where = county ? county + (state ? ', ' + state : '') : state;
    var h = '<b>1 km shoreline segment</b>' +
            (where ? '<span class="pc-where">' + esc(where) + '</span>' : '');
    var hits = [], nOn = 0;
    REG_LAYERS.forEach(function(r){
      if (r[5] < 0 || !regOn[r[0]]) return;
      nOn++;
      if ((A.regmask[i] >> r[5]) & 1) hits.push(r);
    });
    var rows = '<dt>Covered by</dt><dd class="on">' + hits.length + ' of ' + nOn + ' layers</dd>';
    hits.forEach(function(r){
      rows += '<dt></dt><dd><i class="pc-dot" style="background:' + r[2] + '"></i>' + esc(r[1]) + '</dd>';
    });
    return h + '<dl class="pc-dl">' + rows + '</dl>';
  }

  function buildSegments(){
    segLat = new Float64Array(A.n); segLon = new Float64Array(A.n);
    var la = 0, lo = 0, pts = [];
    for (var i = 0; i < A.n; i++) {
      la += A.dlat[i]; lo += A.dlon[i];
      segLat[i] = la / 1e4; segLon[i] = lo / 1e4;
      // 3.1 px, not the facilities' 2.6: adjacent 1 km segments should touch
      // at the national view so the coastline reads as a continuous ribbon
      // of colour rather than beads.
      var m = L.circleMarker([segLat[i], segLon[i]], {renderer:canvas, radius:3.1, weight:0,
        fillColor:attrColor(attrIdx, A.pct[attrIdx][i]), fillOpacity:0.9});
      m._base = 3.1; m._i = i;
      // Leaflet hands the LAYER to a popup content function; `this` is the popup.
      m.bindPopup(function(mk){ return layer === 'regulatory' ? regPopup(mk._i) : segPopup(mk._i); },
                  {maxWidth:270, minWidth:200});
      pts.push(m); segMarkers.push(m);
    }
    segLayer = L.layerGroup(pts);
  }
  function recolourSegments(){
    var P = A.pct[attrIdx];
    for (var i = 0; i < segMarkers.length; i++) segMarkers[i].setStyle({fillColor:attrColor(attrIdx, P[i])});
  }

  // The strip. The segments sit in along-coast order, so the ones inside the
  // viewport, taken in index order, are the coast on screen laid out as an
  // axis -- the data paper's figure, for whatever stretch the reader chose.
  var visible = [];
  function computeVisible(){
    var b = map.getBounds(), s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
    visible = [];
    for (var i = 0; i < A.n; i++) {
      var la = segLat[i], lo = segLon[i];
      if (la >= s && la <= n && lo >= w && lo <= e) visible.push(i);
    }
  }
  function drawStrip(){
    var cv = document.getElementById('strip');
    if (!cv || !A) return;
    // Size from the container, and pin the CSS size before touching the
    // pixel buffer: setting cv.width/height alone resets the intrinsic size
    // and lets the element grow to the buffer's dimensions.
    var dpr = window.devicePixelRatio || 1, H = cv.parentElement.clientHeight, W = cv.clientWidth;
    if (!W || !H) return;
    cv.style.height = H + 'px';
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    var nb = A.attrs.length, bh = H / nb, N = visible.length;
    ctx.fillStyle = '#f1f3f4'; ctx.fillRect(0, 0, W, H);
    if (!N) return;
    for (var x = 0; x < W; x++) {
      var i = visible[Math.min(N - 1, Math.floor(x * N / W))];
      for (var a = 0; a < nb; a++) {
        ctx.fillStyle = attrColor(a, A.pct[a][i]);
        ctx.fillRect(x, a * bh, 1, bh);
      }
    }
    // Breaks in the coast: where consecutive visible segments are not
    // consecutive in the table, the axis jumps. Drawn only when they can be
    // read; at national zoom there are hundreds and they would be noise.
    if (N <= 1500) {
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      for (var k = 1; k < N; k++)
        if (visible[k] - visible[k-1] > 1) ctx.fillRect(Math.floor(k * W / N), 0, 1, H);
    }
    ctx.strokeStyle = '#0b5a8a'; ctx.lineWidth = 1.5;
    ctx.strokeRect(0.75, attrIdx * bh + 0.75, W - 1.5, bh - 1.5);
    var x0 = document.getElementById('stripX');
    // The table's along-coast order is consistent within a coast but its
    // compass sense is not guaranteed across coasts, so the axis says what it
    // is rather than which way it points.
    if (x0) x0.innerHTML = '<span>&larr; along the coast &rarr;</span><span>' + num(N) + ' segments in view</span>';
  }
  function stripTap(ev){
    var cv = ev.currentTarget, r = cv.getBoundingClientRect(), N = visible.length;
    if (!N) return;
    var x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
    var a = Math.min(A.attrs.length - 1, Math.floor(y * A.attrs.length));
    if (a !== attrIdx) { selectAttr(a); return; }
    // Same band tapped again: a vertical slice through every band is one
    // segment's row in the table -- open that row on the map.
    var i = visible[Math.min(N - 1, Math.floor(x * N))];
    var m = segMarkers[i];
    if (map.getZoom() < 8) map.setView(m.getLatLng(), 9); else map.panTo(m.getLatLng());
    setTimeout(function(){ m.openPopup(); }, 350);
  }
  var attrBtns = [];
  function selectAttr(a){
    attrIdx = a;
    attrBtns.forEach(function(b, j){ b.setAttribute('aria-pressed', String(j === a)); });
    if (A) recolourSegments();
    legendAttributes();
  }

  var mini = document.getElementById('mini');
  function lazy(src, ready, then){
    if (ready()) { then(); return; }
    mini.classList.remove('gone');
    // A <script> tag rather than fetch(): it works from file:// as well as
    // over http, so the folder can be opened straight off disk.
    var s = document.createElement('script');
    s.src = src;
    s.onload = function(){ mini.classList.add('gone'); then(); };
    s.onerror = function(){ mini.classList.add('gone'); };
    document.head.appendChild(s);
  }

  // ── regulatory ──────────────────────────────────────────────────────
  var regOn = {}, regLayer = {}, regEnabled = 0, segMode = 'attr';
  REG_LAYERS.forEach(function(r){ regOn[r[0]] = true; });
  function popcount(x){ var c = 0; while (x) { x &= x - 1; c++; } return c; }
  function regCount(i){ return popcount(A.regmask[i] & regEnabled); }
  function regColour(i){ return A.regcols[Math.min(A.regcols.length - 1, regCount(i))]; }
  // The national picture: each segment coloured by how many switched-on
  // layers it sits in or within REG_KM of.
  function regPaint(){
    regEnabled = 0;
    REG_LAYERS.forEach(function(r){ if (regOn[r[0]] && r[5] >= 0) regEnabled |= (1 << r[5]); });
    for (var i = 0; i < segMarkers.length; i++) segMarkers[i].setStyle({fillColor:regColour(i)});
    segMode = 'reg';
  }
  function regLoad(key, then){
    if (regLayer[key]) { then(); return; }
    lazy('data/reg_' + key + '.js', function(){ return !!window.__reg[key]; }, function(){
      var p = window.__reg[key];
      if (!p) return;
      if (!regLayer[key]) {
        regLayer[key] = L.geoJSON(p.geojson, {
          renderer:canvas,
          style:{color:p.color, weight:1.2, opacity:.95, fillColor:p.color, fillOpacity:.3},
          onEachFeature:function(f, l){
            l.bindPopup('<b>' + esc(f.properties.name || p.label) + '</b><em><i class="pc-dot" style="background:' +
                        p.color + '"></i>' + esc(p.label) + '</em>', {maxWidth:250});
          }
        });
      }
      then();
    });
  }
  function regToggle(key){
    regOn[key] = !regOn[key];
    regPaint(); regShow(true); legendRegulatory();
  }
  // Boundaries draw only from REG_MIN_ZOOM: below it they are specks, and
  // the coloured coastline carries the picture. Files load on first need.
  function regShow(on){
    var z = map.getZoom();
    REG_LAYERS.forEach(function(r){
      var k = r[0], want = on && regOn[k] && z >= REG_MIN_ZOOM;
      if (!want) { if (regLayer[k] && map.hasLayer(regLayer[k])) map.removeLayer(regLayer[k]); return; }
      regLoad(k, function(){
        if (layer === 'regulatory' && regOn[k] && map.getZoom() >= REG_MIN_ZOOM && !map.hasLayer(regLayer[k]))
          regLayer[k].addTo(map);
      });
    });
    var hint = document.getElementById('regHint');
    if (hint) hint.textContent = regHintText();
  }
  function regHintText(){
    return map.getZoom() >= REG_MIN_ZOOM ? 'Boundaries simplified to ' + TOL.replace('&#8239;', ' ') + ' · tap one for its name'
                                          : 'Zoom in to draw boundaries';
  }

  // ── dot radius vs zoom ──────────────────────────────────────────────
  // A 2.6 px dot is untappable on a phone however far you zoom. Grow the dots
  // with zoom: small at the national view or the coast turns into one blob,
  // finger-sized once the reader is in a harbour.
  function factor(z){ return z <= 5 ? 1 : Math.min(3.4, 1 + (z - 5) * 0.3); }
  var applied = 1;
  function applyZoom(force){
    var f = factor(map.getZoom());
    if (!force && Math.abs(f - applied) < 0.01) return;
    applied = f;
    var live = layer === 'facilities' ? facMarkers : segMarkers;
    for (var i = 0; i < live.length; i++) live[i].setRadius(live[i]._base * f);
  }
  map.on('zoomend', function(){ applyZoom(false); if (layer === 'regulatory') regShow(true); });

  // ── state / render ──────────────────────────────────────────────────
  // Attributes first: the coloured coastline is the page's opening image.
  // #facilities / #regulatory deep-link straight to the other two.
  var LAYERS = [['attributes','Attributes'], ['facilities','Facilities'], ['regulatory','Regulatory']];
  var hash = (location.hash || '').replace('#', '');
  var layer = LAYERS.some(function(l){ return l[0] === hash; }) ? hash : 'attributes';

  function render(){
    document.getElementById('rowAttrs').classList.toggle('on', layer === 'attributes');
    if (layer === 'attributes') {
      regShow(false); facShow(false, false);
      if (segMode !== 'attr') { recolourSegments(); segMode = 'attr'; }
      segLayer.addTo(map); applyZoom(true);
      computeVisible(); legendAttributes();
    } else if (layer === 'facilities') {
      if (segLayer) map.removeLayer(segLayer);
      regShow(false); legendFacilities();
      ensureFacilities(function(){
        if (layer !== 'facilities') return;          // reader moved on mid-load
        facShow(true, false); applyZoom(true); legendFacilities();
      });
    } else {
      facShow(false, false);
      regPaint(); segLayer.addTo(map); applyZoom(true);
      regShow(true); legendRegulatory();
    }
  }
  map.on('moveend', function(){
    if (layer === 'attributes' && A) { computeVisible(); drawStrip(); }
  });

  // ── legend variants ─────────────────────────────────────────────────
  var body = document.getElementById('lgBody'), top = document.querySelector('.lg-top');
  var foot = document.getElementById('lgFoot'), title = document.getElementById('lgTitle');
  var bar = document.getElementById('lgBar');
  function hideBar(){ bar.classList.remove('on'); bar.innerHTML = ''; top.classList.remove('off'); sizeHandle(); }
  foot.style.display = 'none';

  function legendFacilities(){
    title.textContent = 'Facilities'; hideBar();
    if (!F) { body.innerHTML = ''; return; }
    body.innerHTML = '';
    var ul = document.createElement('ul'); ul.className = 'lg-list';
    CLASSES.forEach(function(c, i){
      var li = document.createElement('li'), b = document.createElement('button');
      b.className = 'lg-row'; b.type = 'button'; b.setAttribute('aria-pressed', String(facVisible[i]));
      b.innerHTML = '<span class="lg-dot" style="background:' + c.color + '"></span>' +
                    '<span class="lg-name">' + esc(c.label) + '</span><span class="lg-n">' + num(c.n) + '</span>';
      b.addEventListener('click', function(){
        facVisible[i] = !facVisible[i];
        b.setAttribute('aria-pressed', String(facVisible[i]));
        if (facVisible[i]) facLayers[i].addTo(map); else map.removeLayer(facLayers[i]);
        legendFacilities();
      });
      li.appendChild(b); ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  function legendAttributes(){
    title.textContent = 'Attributes';
    top.classList.add('off');
    if (!A) {
      bar.classList.add('on');
      bar.innerHTML = '<h3>' + esc(ATTR_LABELS[attrIdx]) + '</h3><span class="desc">Loading the 1&#8239;km shoreline segments…</span>';
      sizeHandle();
      body.innerHTML = '';
      return;
    }
    var m = A.attrs[attrIdx];
    // The colourbar goes in the handle, not the body: it has to stay on
    // screen next to the coloured coastline while the sheet is collapsed.
    var ramp = m.bool ? 'linear-gradient(90deg,' + BOOL[0] + ' 50%,' + BOOL[1] + ' 50%)' : rampCss(A.cmaps[m.cmap]);
    var ax = m.bool ? '<span>no</span><span>yes</span>'
      : '<span>' + esc(fmt(A.q[attrIdx][2], m.unit)) + '</span><span>' + esc(fmt(A.q[attrIdx][50], m.unit)) +
        '</span><span>' + esc(fmt(A.q[attrIdx][98], m.unit)) + '</span>';
    bar.classList.add('on');
    bar.innerHTML =
      '<div class="bar-top"><h3>' + esc(m.label) + (m.unit ? ' <span>(' + esc(m.unit) + ')</span>' : '') + '</h3>' +
      '<span class="lg-tog" aria-hidden="true"></span></div>' +
      '<span class="desc">' + esc(m.desc) + '</span>' +
      '<div class="ramp" style="background:' + ramp + '"></div><div class="ramp-ax">' + ax + '</div>' +
      '<span class="src">' + esc(m.source) + '</span>';
    sizeHandle();
    var labels = A.attrs.map(function(x, a){
      return '<button type="button" data-a="' + a + '" aria-pressed="' + (a === attrIdx) + '"><span>' +
             esc(x.label) + '</span><i></i></button>';
    }).join('');
    body.innerHTML =
      '<div class="strip" style="height:' + (A.attrs.length * 30) + 'px">' +
        '<div class="strip-labels">' + labels + '</div><canvas id="strip"></canvas></div>' +
      '<p class="strip-x" id="stripX"></p>';
    body.querySelectorAll('.strip-labels button').forEach(function(b){
      b.addEventListener('click', function(){ selectAttr(+b.getAttribute('data-a')); });
    });
    document.getElementById('strip').addEventListener('click', stripTap);
    computeVisible(); drawStrip();
  }

  function legendRegulatory(){
    title.textContent = 'Regulatory'; top.classList.add('off');
    var K = A.regcols.length, cells = A.regcols.map(function(c, i){
      return c + ' ' + (100 * i / K) + '% ' + (100 * (i + 1) / K) + '%'; }).join(',');
    var ax = A.regcols.map(function(_c, i){ return '<span>' + i + '</span>'; }).join('');
    bar.classList.add('on');
    bar.innerHTML =
      '<div class="bar-top"><h3>Regulatory overlap <span>(layers)</span></h3>' +
      '<span class="lg-tog" aria-hidden="true"></span></div>' +
      '<span class="desc">How many of the regulatory layers cover a given coastal segment</span>' +
      '<div class="ramp" style="background:linear-gradient(90deg,' + cells + ')"></div>' +
      '<div class="ramp-ax cells">' + ax + '</div>' +
      '<span class="src" id="regHint">' + regHintText() + '</span>';
    sizeHandle();
    var groups = [['closure', 'Closures &amp; occupied water'], ['process', 'Consultation triggers']];
    // layers.MECHANISM vocabulary, in words a reader outside the project uses.
    var MECH = {closure:'Legally closed', occupancy:'Water already in use',
                process:'Consultation or permit on proximity'};
    var html = '';
    groups.forEach(function(g){
      var rows = REG_LAYERS.filter(function(r){ return (r[3] === 'process') === (g[0] === 'process'); });
      if (!rows.length) return;
      html += '<p class="lg-group">' + g[1] + '</p><ul class="lg-list">';
      rows.forEach(function(r){
        var sub = (MECH[r[4]] || r[4]) + (r[5] < 0 ? ' · boundaries only' : '');
        html += '<li><button type="button" class="lg-row" data-k="' + r[0] + '" aria-pressed="' + regOn[r[0]] + '">' +
                '<span class="lg-sw" style="background:' + r[2] + '"></span><span class="lg-name">' + esc(r[1]) +
                '<span class="lg-sub">' + esc(sub) + '</span></span><span class="lg-n">' + num(r[6]) + ' areas</span></button></li>';
      });
      html += '</ul>';
    });
    body.innerHTML = html;
    body.querySelectorAll('.lg-row').forEach(function(b){
      b.addEventListener('click', function(){ regToggle(b.getAttribute('data-k')); });
    });
  }

  // ── legend sheet ────────────────────────────────────────────────────
  var legend = document.getElementById('legend'), handle = document.getElementById('lgHandle');
  function sizeHandle(){ legend.style.setProperty('--handle', handle.offsetHeight + 'px'); }
  sizeHandle(); window.addEventListener('resize', function(){ sizeHandle(); drawStrip(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeHandle);
  function toggleLegend(){
    var open = legend.classList.toggle('open');
    handle.setAttribute('aria-expanded', String(open));
    if (open) setTimeout(drawStrip, 380);      // canvas has no size until the sheet is up
  }
  handle.addEventListener('click', toggleLegend);
  handle.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLegend(); } });

  // ── pills ───────────────────────────────────────────────────────────
  function pills(host, items, get, set){
    var btns = [];
    items.forEach(function(it){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = it.label;
      if (it.title) b.title = it.title;
      b.addEventListener('click', function(){
        set(it.key);
        btns.forEach(function(o, j){ o.setAttribute('aria-pressed', String(items[j].key === get())); });
      });
      host.appendChild(b); btns.push(b);
    });
    btns.forEach(function(o, j){ o.setAttribute('aria-pressed', String(items[j].key === get())); });
    return btns;
  }
  var layerBtns = pills(document.getElementById('rowLayers'),
        LAYERS.map(function(l){ return {key:l[0], label:l[1]}; }),
        function(){ return layer; },
        function(k){ layer = k; render(); });
  attrBtns = pills(document.getElementById('rowAttrs'),
        ATTR_LABELS.map(function(l, i){ return {key:i, label:l}; }),
        function(){ return attrIdx; },
        function(k){ selectAttr(k); });
  var rbtns = pills(document.getElementById('rowRegions'),
        REGIONS.map(function(r){ return {key:r[0], label:r[0], title:r[1]}; }),
        function(){ return null; },
        function(k){ REGIONS.forEach(function(r){ if (r[0] === k) map.fitBounds(r[2], FIT); }); });
  function markRegion(k){ rbtns.forEach(function(o, j){ o.setAttribute('aria-pressed', String(REGIONS[j][0] === k)); }); }
  document.getElementById('rowRegions').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (b) markRegion(b.textContent.trim());
  });
  map.on('dragend', function(){ markRegion(null); });

  // A hash edit in the address bar, or a second QR with a different hash
  // scanned into an already-open tab, switches layer without a reload.
  window.addEventListener('hashchange', function(){
    var h = (location.hash || '').replace('#', '');
    if (h !== layer && LAYERS.some(function(l){ return l[0] === h; })) {
      layer = h; render();
      layerBtns.forEach(function(o, j){ o.setAttribute('aria-pressed', String(LAYERS[j][0] === layer)); });
    }
  });

  map.fitBounds(REGIONS[0][2], FIT);
  markRegion('US');
  A = window.__attr; buildLuts(); buildSegments();
  render();
  document.getElementById('veil').classList.add('gone');
})();
</script>
</body>
</html>
